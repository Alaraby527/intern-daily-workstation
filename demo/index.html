<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实习生每日工作台｜只读交互预览</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#182230;--muted:#718096;--line:#e2e8ef;--teal:#087f76;--teal2:#e7f7f4;--orange:#bd6419;--orange2:#fff2e5;--shadow:0 12px 32px #2333440c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}.wrap{max-width:1160px;margin:auto;padding:32px 22px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.eyebrow{font-weight:800;color:var(--teal);font-size:12px;letter-spacing:.1em}.top h1{margin:8px 0;font-size:29px}.top p{color:var(--muted);margin:0}.tag{color:var(--orange);background:var(--orange2);border:1px solid #f0d1b5;border-radius:999px;padding:7px 12px;white-space:nowrap}.switch{display:flex;background:#e9edf1;padding:4px;border-radius:10px;gap:4px;margin:24px 0 16px}.switch button{border:0;background:transparent;padding:9px 14px;color:var(--muted);border-radius:7px}.switch button.active{background:#fff;color:var(--teal);box-shadow:0 2px 7px #1b35400f;font-weight:700}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:16px}.panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:18px}.panel h2{font-size:17px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.progress{height:9px;background:#e9eef0;border-radius:9px;margin:17px 0 22px}.progress i{display:block;width:67%;height:100%;background:var(--teal);border-radius:9px}.task{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}.task.done{background:#fbfefd;border-color:#b7e1d9}.task input{accent-color:var(--teal);width:18px;height:18px;margin-top:2px}.task strong{display:block}.task small{color:var(--muted)}.pill{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}.ok{color:var(--teal);background:var(--teal2)}.pending{color:var(--orange);background:var(--orange2)}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric span{color:var(--muted)}.big{font-size:28px;font-weight:800}.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 14px;margin-top:15px}.btn.secondary{background:#eef2f3;color:var(--ink);margin-left:7px}.notice{margin-top:15px;padding:12px;background:#fbf5e9;color:#815d1b;border-radius:10px;font-size:12px}.mentor-card{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.mentor-card header{display:flex;justify-content:space-between;gap:12px}.mentor-card p{margin:8px 0;color:var(--muted)}.mentor-card button{background:var(--teal2);color:var(--teal);border:0;padding:7px 10px;border-radius:7px}@media(max-width:780px){.top{display:block}.tag{display:inline-block;margin-top:13px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">PORTFOLIO DEMO · READ-ONLY PREVIEW</div><h1>实习生每日工作台</h1><p>把「今日任务 → 打卡提交 → Mentor 验收」串成一个可观察的闭环。</p></div><div class="tag">只读预览 · 脱敏示例 · 未连接飞书</div></header>
<nav class="switch"><button class="active" data-view="intern">实习生视图</button><button data-view="mentor">Mentor 验收台</button></nav>
<section id="app"></section>
</main>
<script>
const tasks=[{id:"t1",title:"完成今日创作者触达",desc:"按 SOP 完成 20 个有效触达，记录结果链接。",done:true},{id:"t2",title:"整理 3 条高潜内容线索",desc:"提交内容链接，并标注账号类型与判断依据。",done:true},{id:"t3",title:"填写下班前复盘",desc:"补充完成量、卡点和明日计划，提交给 Mentor。",done:false}];
let view="intern",submitted=false,approved=false;
function internView(){return '<div class="grid"><article class="panel"><h2>你好，实习生 A</h2><div class="sub">创作者触达组 · 2026-08-25</div><div class="progress"><i></i></div>'+tasks.map((t,i)=>'<label class="task '+(t.done?"done":"")+'"><input type="checkbox" data-task="'+i+'" '+(t.done?"checked":"")+'><span><strong>'+t.title+'</strong><small>'+t.desc+'</small></span><span class="pill '+(t.done?"ok":"pending")+'">'+(t.done?"已完成":"待完成")+'</span></label>').join("")+'<button class="btn" id="submit">'+(submitted?"已提交，等待 Mentor 验收":"提交今日打卡")+'</button><button class="btn secondary" id="reset">重置示例</button><div class="notice">演示说明：勾选状态与提交状态仅保存在当前页面；真实版本才会写入本地缓存并异步同步飞书。</div></article><aside class="panel"><h2>今日概览</h2><div class="metric"><span>任务完成</span><b id="count">2 / 3</b></div><div class="metric"><span>目标量</span><b>20</b></div><div class="metric"><span>当前状态</span><span class="pill '+(submitted?"pending":"ok")+'">'+(submitted?"待 Mentor 验收":"执行中")+'</span></div><div class="metric"><span>同步状态</span><span>未连接</span></div></aside></div>'}
function mentorView(){const rows=[["实习生 A","创作者触达组","18 / 20","待验收"],["实习生 B","内容供给组","25 / 25","已通过"],["实习生 C","情报产品组","—","需补充"]];return '<div class="grid"><article class="panel"><h2>今日验收队列</h2><div class="sub">聚焦需要 Mentor 做判断的提交</div>'+rows.map((r,i)=>'<div class="mentor-card"><header><strong>'+r[0]+' · '+r[1]+'</strong><span class="pill '+(r[3]==="已通过"?"ok":"pending")+'">'+(i===0&&approved?"已通过":r[3])+'</span></header><p>完成量：'+r[2]+'　|　交付物：'+(i===2?"未提交":"已关联示例链接")+'</p><button data-approve="'+i+'">'+(i===0&&approved?"已记录验收":"记录验收结果")+'</button></div>').join("")+'</article><aside class="panel"><h2>验收原则</h2><div class="metric"><span>今日提交</span><b>3</b></div><div class="metric"><span>待处理</span><b>2</b></div><div class="metric"><span>飞书同步</span><span>未接入</span></div><div class="notice">真实版本的 Mentor 验收仍需人工确认；此处只展示脱敏数据和状态变化，不执行任何外部写回。</div></aside></div>'}
function render(){document.querySelector("#app").innerHTML=view==="intern"?internView():mentorView();document.querySelectorAll(".switch button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="intern"){document.querySelectorAll("[data-task]").forEach(el=>el.onchange=()=>{tasks[Number(el.dataset.task)].done=el.checked;submitted=false;render()});document.querySelector("#submit").onclick=()=>{submitted=true;render()};document.querySelector("#reset").onclick=()=>{tasks[0].done=true;tasks[1].done=true;tasks[2].done=false;submitted=false;render()};document.querySelector("#count").textContent=tasks.filter(t=>t.done).length+" / 3"}else document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{if(b.dataset.approve==="0"){approved=true;render()}})}
document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script>
</body></html>
